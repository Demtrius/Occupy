[tool.poetry]
name = "api"
version = "0.1.0"
description = "Occupy API"
authors = ["0Empty0 <viktor.harhatt@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = ">=0.119.0,<0.120.0"
uvicorn = {extras = ["standard"], version = ">=0.38.0,<0.39.0"}
sqlalchemy = ">=2.0.44,<3.0.0"
alembic = ">=1.17.0,<2.0.0"
pydantic = ">=2.12.3,<3.0.0"
python-dateutil = ">=2.9.0.post0,<3.0.0"
redis = ">=6.4.0,<7.0.0"
dramatiq = ">=1.18.0,<2.0.0"
python-jose = ">=3.5.0,<4.0.0"
argon2-cffi = ">=25.1.0,<26.0.0"
boto3 = ">=1.40.55,<2.0.0"
slowapi = ">=0.1.9,<1.0.0"
structlog = ">=25.4.0,<26.0.0"


[tool.poetry.group.dev.dependencies]
ruff = "^0.14.1"
mypy = "^1.18.2"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
httpx = "^0.28.1"
types-redis = "^4.6.0.20241004"
types-python-dateutil = "^2.9.0.20251008"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-select = ["I"] # import sorting
exclude = ["alembic/"]

[tool.ruff.lint.per-file-ignores]
"app/api/deps/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
plugins = []
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["alembic/"]
mypy_path = ["app"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
