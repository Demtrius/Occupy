[tool.poetry]
name = "api"
version = "0.1.0"
description = "Occupy API"
authors = ["0Empty0 <viktor.harhatt@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
fastapi = ">=0.119.0,<0.120.0"
uvicorn = {extras = ["standard"], version = ">=0.38.0,<0.39.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.44"}
aiosqlite = ">=0.20.0,<1.0.0"
pydantic = ">=2.12.3,<3.0.0"
python-dateutil = ">=2.9.0.post0,<3.0.0"
redis = ">=6.4.0,<7.0.0"
dramatiq = ">=1.18.0,<2.0.0"
python-jose = ">=3.5.0,<4.0.0"
argon2-cffi = ">=25.1.0,<26.0.0"
slowapi = ">=0.1.9,<1.0.0"
structlog = ">=25.4.0,<26.0.0"
asyncpg = "^0.30.0"
minio = "^7.2.18"


[tool.poetry.group.dev.dependencies]
ruff = "^0.14.1"
mypy = "^1.18.2"
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"
pytest-cov = "^5.0.0"
httpx = "^0.28.1"
hypothesis = "^6.0.0"
freezegun = "^1.5.0"
faker = "^30.0.0"
asgi-lifespan = "^2.1.0"
websocket = "^0.2.1"
alembic = ">=1.17.0,<2.0.0"
email-validator = "^2.0.0"
types-redis = "^4.6.0.20241004"
types-python-dateutil = "^2.9.0.20251008"
testcontainers = {extras = ["compose", "postgres", "redis", "minio"], version = "^4.13.2"}

[tool.basedpyright]
typeCheckingMode = "strict"
allowedUntypedLibraries = ["testcontainers"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["alembic/"]

[tool.ruff.lint]
extend-select = ["I", "N"] # import sorting, naming conventions


[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "-q --strict-markers --strict-config --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.13"
plugins = []
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
exclude = ["alembic/"]
mypy_path = ["app"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
