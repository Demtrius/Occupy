version: "3.9"

networks:
  public:
  internal:

volumes:
  db_data:
  minio_data:
  nginx_logs:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: clique
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clique"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.production}
    volumes:
      - minio_data:/data
    # Do NOT publish ports publicly in prod unless you really need to.
    expose:
      - "9000" # S3 API (internal only)
      - "9001" # Console (internal only)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  # One-off init to create bucket; reruns harmlessly
  create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    entrypoint: >
      /bin/sh -c "
      sleep 1 &&
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/${MINIO_BUCKET:-clique-media} || true &&
      mc anonymous set download local/${MINIO_BUCKET:-clique-media} || true
      "
    restart: "no"
    networks: [internal]

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    env_file: ../../apps/api/.env.production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    expose:
      - "8000"
    restart: unless-stopped
    networks: [internal]
    command: >
      bash -lc "poetry run uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --proxy-headers"

  worker:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    env_file: ../../apps/api/.env.production
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["bash", "-lc", "poetry run python -m app.worker"]
    restart: unless-stopped
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_started
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - public
      - internal
