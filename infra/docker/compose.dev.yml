services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clique
    ports: ["5432:5432"]
    volumes: [db_data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: clique
      MINIO_ROOT_PASSWORD: clique-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  create-bucket:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 clique clique-secret &&
      mc mb -p local/clique-media || true &&
      mc anonymous set download local/clique-media
      "

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    env_file: ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/clique
    depends_on: [db, redis, minio, create-bucket]
    ports: ["8000:8000"]
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages

volumes:
  db_data:
  minio_data:
