map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  # Leave HTTP available until real TLS certs are mounted.
  # Uncomment the redirect below once HTTPS is ready.
  # return 301 https://$host$request_uri;

  # If staying on HTTP for now, keep this and comment the return above:
  client_max_body_size 25m;
  sendfile on;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain application/xml;
  gzip_vary on;

  # Security headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy no-referrer-when-downgrade;

  # Health
  location = /nginx/health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Proxy all API (REST + WebSockets) to FastAPI
  location / {
    proxy_pass http://api:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade (for /ws/*)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Timeouts tuned for long-lived WS
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;
}

server {
  listen 443 ssl;
  http2 on;
  server_name occupy-app.com www.occupy-app.com;

  ssl_certificate /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 25m;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain application/xml;
  gzip_vary on;

  # Security headers (mirrors HTTP block)
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy no-referrer-when-downgrade;

  location = /nginx/health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  location / {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;
}

